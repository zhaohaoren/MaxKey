application:
  title: 'MaxKey'
  name: 'MaxKey'
  formatted-version: 'v2.0.0 GA'
server:
  port: '443'
  ssl:
    key-store: 'maxkeyserver.keystore'
    key-alias: 'maxkey'
    enabled: 'true'
    key-store-password: 'maxkey'
    key-store-type: 'JKS'
  servlet:
    context-path: '/maxkey'
spring:
  servlet:
    multipart:
      enabled: 'true'
      max-file-size: '4194304'
  datasource:
    username: 'root'
    password: 'maxkey'
    url: 'jdbc:mysql://localhost/maxkey?autoReconnect=true&characterEncoding=UTF-8&serverTimezone=UTC'
    driver-class-name: 'com.mysql.cj.jdbc.Driver'
    type: 'com.alibaba.druid.pool.DruidDataSource'
  redis:
    host: '127.0.0.1'
    port: '6379'
    password: 'password'
    timeout: '10000'
    jedis:
      pool:
        max-wait: '1000'
        max-idle: '200'
    lettuce:
      pool:
        max-active: '-1'
        min-idle: '0'
  mail:
    default-encoding: 'utf-8'
    host: 'smtp.163.com'
    port: '465'
    username: 'maxkey@163.com'
    password: 'password'
    protocol: 'smtp'
    properties:
      ssl: 'true'
      sender: 'maxkey@163.com'
      mailotp:
        message:
          subject: 'MaxKey One Time PassWord'
          template: '{0} You Token is {1} , it validity in {2}  minutes.'
  freemarker:
    template-loader-path: 'classpath:/templates/views'
    cache: 'false'
    charset: 'UTF-8'
    check-template-location: 'true'
    content-type: 'text/html'
    expose-request-attributes: 'false'
    expose-session-attributes: 'false'
    request-context-attribute: 'request'
    suffix: '.ftl'
  mvc:
    static-path-pattern: '/static/**'
  messages:
    basename: 'classpath:messages/message'
    encoding: 'UTF-8'
  main:
    banner-mode: 'log'
    allow-bean-definition-overriding: 'true'
  kafka:
    bootstrap-servers: 'localhost:9092'
    producer:
      retries: '0'
      acks: '1'
      batch-size: '16384'
      properties:
        linger:
          ms: '0'
      buffer-memory: '33554432'
      key-serializer: 'org.apache.kafka.common.serialization.StringSerializer'
      value-serializer: 'org.apache.kafka.common.serialization.StringSerializer'
mybatis:
  type-aliases-package: 'org.maxkey.domain,org.maxkey.domain.apps,'
  mapper-locations: 'classpath*:/org/maxkey/persistence/mapper/xml/mysql/*.xml'
maxkey:
  server:
    domain: 'maxkey.top'
    'domain.sub': 'sso.${maxkey.server.domain}'
    name: 'http://${maxkey.server.domain.sub}'
    prefix:
      uri: '${maxkey.server.name}/maxkey'
    default:
      uri: '${maxkey.server.prefix.uri}/maxkey/appList'
    management:
      uri: '${maxkey.server.name}:9521/maxkey-mgt/login'
    persistence: '0'
  identity:
    kafkasupport: 'false'
  app:
    issuer: 'CN=ConSec,CN=COM,CN=SH'
  login:
    captcha: 'true'
    'captcha.type': 'text'
    mfa: 'true'
    'mfa.type': 'TimeBasedOtpAuthn'
    socialsignon: 'true'
    'socialsignon.providers': 'sinaweibo,google,qq,dingtalk,microsoft,facebook'
    kerberos: 'true'
    wsfederation: 'false'
    remeberme: 'true'
    'remeberme.validity': '0'
    default:
      uri: 'appList'
  ipaddress:
    whitelist: 'false'
  otp:
    sms: 'SmsOtpAuthnYunxin'
    'sms.aliyun.accesskeyid': '94395d754eb55693043f5d6a2b772ef4'
    'sms.aliyun.accesssecret': '05d5485357bc'
    'sms.aliyun.templatecode': '14860095'
    'sms.aliyun.signname': 'maxkey'
    'sms.yunxin.appkey': '94395d754eb55693043f5d6a2b772ef4'
    'sms.yunxin.appsecret': '05d5485357bc'
    'sms.yunxin.templateid': '14860095'
    'sms.tencentcloud.secretid': '94395d754eb55693043f5d6a2b772ef4'
    'sms.tencentcloud.secretkey': '05d5485357bc'
    'sms.tencentcloud.smssdkappid': '1486220095'
    'sms.tencentcloud.templateid': '14860095'
    'sms.tencentcloud.sign': '1486009522'
    keyuri:
      format:
        type: 'totp'
        digits: '6'
        issuer: 'MaxKey'
        domain: '${maxkey.server.domain}'
        period: '30'
  support:
    kerberos:
      default:
        userdomain: 'MAXKEY'
        fulluserdomain: 'MAXKEY.ORG'
        crypto: '846KZSzYq56M6d5o'
        redirecturi: 'http://sso.maxkey.top/kerberos/authn/'
    httpheader:
      enable: 'false'
      headername: 'header-user'
    basic:
      enable: 'false'
    wsfederation:
      identifier: 'http://adfs.maxkey.top/adfs/services/trust'
      url: 'https://adfs.maxkey.top/adfs/ls/'
      principal: 'upn'
      relyingParty: 'urn:federation:connsec'
      signingCertificate: 'adfs-signing.crt'
      tolerance: '10000'
      upn:
        suffix: 'maxkey.org'
      logoutUrl: 'https://adfs.maxkey.top/adfs/ls/?wa=wsignout1.0'
  oidc:
    metadata:
      issuer: '${maxkey.server.name}/maxkey'
      authorizationEndpoint: '${maxkey.server.name}/maxkey/authz/oauth/v20/authorize'
      tokenEndpoint: '${maxkey.server.name}/maxkey/authz/oauth/v20/token'
      userinfoEndpoint: '${maxkey.server.name}/maxkey/api/connect/userinfo'
  saml:
    v20:
      max:
        parser:
          pool:
            size: '2'
      assertion:
        validity:
          time:
            ins:
              seconds: '90'
      replay:
        cache:
          life:
            in:
              millis: '14400000'
      issue:
        instant:
          check:
            clock:
              skew:
                in:
                  seconds: '90'
            validity:
              time:
                in:
                  seconds: '300'
      idp:
        keystore: 'classpath:config/samlServerKeystore.jks'
        'keystore.password': 'maxkey'
        'keystore.private.key.password': 'maxkey'
        issuing:
          entity:
            id: 'maxkey.top'
        issuer: 'https://sso.maxkey.top/maxkey/saml'
        receiver:
          endpoint: 'https://sso.maxkey.top/'
      sp:
        keystore: 'classpath:config/samlClientKeystore.jks'
        'keystore.password': 'maxkey'
        'keystore.private.key.password': 'maxkey'
        issuing:
          entity:
            id: 'client.maxkey.org'
      metadata:
        orgName: 'maxkey'
        orgDisplayName: 'maxkey'
        orgURL: 'https://github.com/shimingxy/MaxKey'
        contactType: 'technical'
        company: 'maxkey'
        givenName: 'maxkey'
        surName: 'maxkey'
        emailAddress: 'shimingxy@163.com'
        telephoneNumber: '4008981111'
  socialsignon:
