#kaptcha.noise.color=white

kaptcha:
  image:
    width: '80'
    height: '40'
  border: 'no'
  obscurificator:
    impl: 'com.google.code.kaptcha.impl.ShadowGimpy'
  textproducer:
    font:
      size: '23'
    char:
      string: '0123456789'
      length: '4'
  noise:
    impl: 'com.google.code.kaptcha.impl.NoNoise'
