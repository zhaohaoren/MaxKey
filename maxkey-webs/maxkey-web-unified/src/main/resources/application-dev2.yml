spring:
  boot:
    admin:
      client:
        enabled: ${SPRING_BOOT_ADMIN_ENABLED:false}
        password: ${SPRING_BOOT_ADMIN_PASSWORD:}
        url: ${SPRING_BOOT_ADMIN_URL:http://127.0.0.1:9528}
        username: ${SPRING_BOOT_ADMIN_USERNAME:}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DATABASE_HOST:127.0.0.1}:${DATABASE_PORT:3306}/${DATABASE_NAME:snowx_iam}?allowPublicKeyRetrieval=true&useSSL=false&autoReconnect=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8
    username: ${DATABASE_USER:root}
    password: ${DATABASE_PWD:mysql123}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    jedis:
      pool:
        max-idle: 200
        max-wait: 1000
    lettuce:
      pool:
        max-active: -1
        min-idle: 0
    password: ${REDIS_PWD:redis123}
    port: ${REDIS_PORT:6379}
    timeout: 10000
  freemarker:
    cache: false
    charset: UTF-8
    check-template-location: true
    content-type: text/html
    expose-request-attributes: false
    expose-session-attributes: false
    request-context-attribute: request
    suffix: .ftl
    template-loader-path: classpath:/templates/views
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  mail:
    default-encoding: utf-8
    host: ${MAIL_HOST:smtp.163.com}
    password: ${MAIL_PWD:password}
    port: ${MAIL_PORT:465}
    properties:
      mailotp:
        message:
          subject: MaxKey One Time PassWord
          template: '{0} You Token is {1} , it validity in {2}  minutes.'
          type: html
          validity: 300
      sender: ${MAIL_SENDER:maxkey@163.com}
      ssl: true
    protocol: smtp
    username: ${MAIL_USER:maxkey@163.com}
  messages:
    basename: classpath:messages/message
    encoding: UTF-8
  mvc:
    date-format: yyyy-MM-dd HH:mm:ss
    static-path-pattern: /static/**
  servlet:
    multipart:
      enabled: true
      max-file-size: 4194304
mybatis:
  dialect: mysql
  mapper-locations: classpath*:/org/dromara/maxkey/persistence/mapper/xml/${mybatis.dialect}/*.xml
  table-column-case: lowercase
  table-column-escape: false
  table-column-snowflake-datacenter-id: 1
  table-column-snowflake-machine-id: 1
  type-aliases-package: org.dromara.maxkey.entity,org.dromara.maxkey.entity.apps,
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl


